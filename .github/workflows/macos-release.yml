name: Publish macOS DMGs

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out published release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in
            x86_64|amd64) normalized_arch=x86_64 ;;
            arm64|aarch64) normalized_arch=arm64 ;;
            *)
              echo "Unsupported runner architecture from uname -m: $(uname -m)" >&2
              exit 1
              ;;
          esac

          if [[ "${normalized_arch}" != "${EXPECTED_ARCH}" ]]; then
            echo "Runner architecture mismatch: expected ${EXPECTED_ARCH}, got ${normalized_arch}." >&2
            exit 1
          fi

      - name: Build app bundle and DMG
        id: bundle
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: scripts/bundle-macos.sh

      - name: Upload DMG to published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DMG_PATH: ${{ steps.bundle.outputs.dmg }}
        run: |
          if ! test -s "${DMG_PATH}"; then
            echo "DMG is missing or empty: ${DMG_PATH}" >&2
            exit 1
          fi

          gh release upload "${RELEASE_TAG}" "${DMG_PATH}" --clobber
