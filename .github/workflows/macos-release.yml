name: Publish macOS DMGs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild without moving it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out pushed tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and main reachability
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          SEMVER_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "${RELEASE_TAG}" =~ ${SEMVER_REGEX} ]]; then
            printf 'Invalid release tag %q. Expected v-prefixed SemVer.\n' "${RELEASE_TAG}" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" refs/remotes/origin/main; then
            printf 'Release tag must point to a commit reachable from main.\n' >&2
            exit 1
          fi

          {
            printf 'tag=%s\n' "${RELEASE_TAG}"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel builds are temporarily disabled until the runner/signing
          # path is stable again.
          # - runner: macos-15-intel
          #   arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Check out validated tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # A manual recovery run keeps source code pinned to the immutable tag,
      # but can use a repaired packaging script from the workflow revision.
      - name: Check out current release tooling
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false

      - name: Use current release tooling
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 .release-tooling/scripts/bundle-macos.sh scripts/bundle-macos.sh
          rm -rf .release-tooling

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Prepare signing and notarization material
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          for variable in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_CODESIGN_IDENTITY APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!variable}" ]]; then
              printf 'Missing required signing secret: %s\n' "${variable}" >&2
              exit 1
            fi
          done

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          API_KEY_PATH="${RUNNER_TEMP}/notary-api-key.p8"
          KEYCHAIN_PATH="${RUNNER_TEMP}/averroes-signing.keychain-db"
          ORIGINAL_KEYCHAINS_PATH="${RUNNER_TEMP}/averroes-original-keychains.txt"
          NOTARY_RESPONSE_PATH="${RUNNER_TEMP}/notarytool-response.json"
          NOTARY_ERROR_PATH="${RUNNER_TEMP}/notarytool-submit.stderr"
          NOTARY_LOG_PATH="${RUNNER_TEMP}/notarytool-log.json"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          {
            printf 'CERTIFICATE_PATH=%s\n' "${CERTIFICATE_PATH}"
            printf 'API_KEY_PATH=%s\n' "${API_KEY_PATH}"
            printf 'KEYCHAIN_PATH=%s\n' "${KEYCHAIN_PATH}"
            printf 'CODESIGN_KEYCHAIN=%s\n' "${KEYCHAIN_PATH}"
            printf 'ORIGINAL_KEYCHAINS_PATH=%s\n' "${ORIGINAL_KEYCHAINS_PATH}"
            printf 'NOTARY_RESPONSE_PATH=%s\n' "${NOTARY_RESPONSE_PATH}"
            printf 'NOTARY_ERROR_PATH=%s\n' "${NOTARY_ERROR_PATH}"
            printf 'NOTARY_LOG_PATH=%s\n' "${NOTARY_LOG_PATH}"
          } >> "${GITHUB_ENV}"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 -D > "${API_KEY_PATH}"
          chmod 600 "${API_KEY_PATH}"

          security list-keychains -d user > "${ORIGINAL_KEYCHAINS_PATH}"
          original_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            [[ -z "${keychain}" ]] && continue
            original_keychains+=("${keychain}")
          done < "${ORIGINAL_KEYCHAINS_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${original_keychains[@]}"
          security import "${CERTIFICATE_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -x \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          if ! security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -F -- "\"${APPLE_CODESIGN_IDENTITY}\"" >/dev/null; then
            printf 'Configured signing identity was not imported into the temporary keychain.\n' >&2
            exit 1
          fi

      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64|amd64) actual_arch=x86_64 ;;
            arm64|aarch64) actual_arch=arm64 ;;
            *)
              printf 'Unsupported runner architecture from uname -m: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          if [[ "${actual_arch}" != "${EXPECTED_ARCH}" ]]; then
            printf 'Runner architecture mismatch: expected %s, got %s.\n' "${EXPECTED_ARCH}" "${actual_arch}" >&2
            exit 1
          fi

      - name: Build app bundle and DMG
        id: bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        shell: bash
        run: scripts/bundle-macos.sh

      - name: Notarize and validate DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DMG_PATH: ${{ steps.bundle.outputs.dmg }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s "${DMG_PATH}" ]]; then
            printf 'DMG is missing or empty: %s\n' "${DMG_PATH}" >&2
            exit 1
          fi

          set +e
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --output-format json > "${NOTARY_RESPONSE_PATH}" 2> "${NOTARY_ERROR_PATH}"
          submit_status=$?
          set -e

          notarization_status="$(ruby -rjson -e '
            begin
              response = JSON.parse(File.read(ARGV.fetch(0)))
              print response["status"] if response.is_a?(Hash) && response["status"].is_a?(String)
            rescue StandardError
            end
          ' "${NOTARY_RESPONSE_PATH}")"

          if [[ "${submit_status}" -ne 0 || "${notarization_status}" != "Accepted" ]]; then
            submission_id="$(ruby -rjson -e '
              begin
                response = JSON.parse(File.read(ARGV.fetch(0)))
                print response["id"] if response.is_a?(Hash) && response["id"].is_a?(String)
              rescue StandardError
              end
            ' "${NOTARY_RESPONSE_PATH}")"

            if [[ -n "${submission_id}" ]]; then
              set +e
              xcrun notarytool log "${submission_id}" \
                --key "${API_KEY_PATH}" \
                --key-id "${APPLE_API_KEY_ID}" \
                --issuer "${APPLE_API_ISSUER_ID}" > "${NOTARY_LOG_PATH}" 2>&1
              log_status=$?
              set -e

              if [[ -s "${NOTARY_LOG_PATH}" ]]; then
                stop_commands_marker="$(uuidgen)"
                printf '::stop-commands::%s\n' "${stop_commands_marker}"
                ruby -e 'path = ARGV.fetch(0); STDOUT.write(File.binread(path)) if File.file?(path)' "${NOTARY_LOG_PATH}"
                printf '::%s::\n' "${stop_commands_marker}"
              fi
              if [[ "${log_status}" -ne 0 ]]; then
                printf 'Could not retrieve the Apple notarization log.\n' >&2
              fi
            fi

            if [[ "${submit_status}" -ne 0 ]]; then
              exit "${submit_status}"
            fi

            printf 'Notarization did not complete with Accepted status (got: %s).\n' "${notarization_status:-missing}" >&2
            exit 1
          fi

          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          hdiutil verify "${DMG_PATH}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${DMG_PATH}"

      - name: Verify signed app in DMG
        env:
          DMG_PATH: ${{ steps.bundle.outputs.dmg }}
        shell: bash
        run: |
          set -euo pipefail

          MOUNT_POINT="$(mktemp -d "${RUNNER_TEMP}/averroes-verify.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "${MOUNT_POINT}" -force >/dev/null 2>&1 || true
            rm -rf "${MOUNT_POINT}"
          }
          trap cleanup_mount EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "${MOUNT_POINT}" "${DMG_PATH}"
          if [[ ! -d "${MOUNT_POINT}/Averroes.app" ]]; then
            printf 'Expected Averroes.app is missing from the mounted DMG.\n' >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${MOUNT_POINT}/Averroes.app"
          spctl --assess --type execute --verbose=2 "${MOUNT_POINT}/Averroes.app"

      - name: Upload validated DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-dmg-${{ matrix.arch }}
          path: ${{ steps.bundle.outputs.dmg }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarization-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/notarytool-response.json
            ${{ runner.temp }}/notarytool-submit.stderr
            ${{ runner.temp }}/notarytool-log.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "${ORIGINAL_KEYCHAINS_PATH:-}" ]]; then
            original_keychains=()
            while IFS= read -r keychain; do
              keychain="${keychain#"${keychain%%[![:space:]]*}"}"
              keychain="${keychain#\"}"
              keychain="${keychain%\"}"
              [[ -z "${keychain}" ]] && continue
              original_keychains+=("${keychain}")
            done < "${ORIGINAL_KEYCHAINS_PATH}"
            if [[ "${#original_keychains[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${original_keychains[@]}" || true
            fi
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" && -e "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
          rm -f "${CERTIFICATE_PATH:-}" "${API_KEY_PATH:-}" "${ORIGINAL_KEYCHAINS_PATH:-}"

  publish:
    name: Publish GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Prepare artifact workspace
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACTS_DIR="${RUNNER_TEMP}/averroes-release-artifacts"
          rm -rf "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"

      - name: Download arm64 DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-dmg-arm64
          path: ${{ runner.temp }}/averroes-release-artifacts

      # - name: Download x86_64 DMG
      #   uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      #   with:
      #     name: validated-dmg-x86_64
      #     path: ${{ runner.temp }}/averroes-release-artifacts

      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job intentionally has no checkout. Tell `gh` which
          # repository to use instead of relying on a local `.git` directory.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ARTIFACTS_DIR: ${{ runner.temp }}/averroes-release-artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARM64_NAME="Averroes-${RELEASE_VERSION}-macos-arm64.dmg"
          # X86_64_NAME="Averroes-${RELEASE_VERSION}-macos-x86_64.dmg"
          CHECKSUM_NAME="SHA256SUMS.txt"
          ARM64_DMG="${ARTIFACTS_DIR}/${ARM64_NAME}"
          # X86_64_DMG="${ARTIFACTS_DIR}/${X86_64_NAME}"
          CHECKSUM_PATH="${ARTIFACTS_DIR}/${CHECKSUM_NAME}"
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            RELEASE_PRERELEASE=true
          else
            RELEASE_PRERELEASE=false
          fi

          shopt -s dotglob nullglob
          artifact_paths=("${ARTIFACTS_DIR}"/*)
          if [[ "${#artifact_paths[@]}" -ne 1 ]]; then
            printf 'Expected exactly one validated DMG artifact.\n' >&2
            exit 1
          fi
          for artifact_path in "${artifact_paths[@]}"; do
            case "$(basename "${artifact_path}")" in
              "${ARM64_NAME}") ;;
              # "${X86_64_NAME}") ;;
              *)
                printf 'Unexpected artifact file: %s\n' "${artifact_path}" >&2
                exit 1
                ;;
            esac
          done
          for dmg_path in "${ARM64_DMG}"; do
            if [[ ! -f "${dmg_path}" || -L "${dmg_path}" || ! -s "${dmg_path}" ]]; then
              printf 'Expected a nonempty regular DMG file: %s\n' "${dmg_path}" >&2
              exit 1
            fi
          done

          (
            cd "${ARTIFACTS_DIR}"
            shasum -a 256 "${ARM64_NAME}" > "${CHECKSUM_NAME}"
          )

          RELEASE_VIEW_ERROR_PATH="${RUNNER_TEMP}/averroes-release-view.stderr"
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2> "${RELEASE_VIEW_ERROR_PATH}")"; then
            if [[ "${release_is_draft}" != "true" ]]; then
              printf 'Refusing to modify the published release for %s.\n' "${RELEASE_TAG}" >&2
              exit 1
            fi

            existing_asset_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            while IFS= read -r asset_name; do
              [[ -z "${asset_name}" ]] && continue
              case "${asset_name}" in
                "${ARM64_NAME}"|"${CHECKSUM_NAME}") ;;
                # "${X86_64_NAME}") ;;
                *)
                  printf 'Refusing to modify draft release with unknown asset: %s\n' "${asset_name}" >&2
                  exit 1
                  ;;
              esac
            done <<< "${existing_asset_names}"
          else
            release_view_status=$?
            release_view_error="$(<"${RELEASE_VIEW_ERROR_PATH}")"
            if [[ "${release_view_error}" != *"release not found"* && "${release_view_error}" != *"HTTP 404"* ]]; then
              printf '%s\n' "${release_view_error}" >&2
              exit "${release_view_status}"
            fi

            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --prerelease="${RELEASE_PRERELEASE}" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" \
            "${ARM64_DMG}" \
            "${CHECKSUM_PATH}" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --prerelease="${RELEASE_PRERELEASE}"
