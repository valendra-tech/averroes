name: Build macOS bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "assets/**"
      - "scripts/bundle-macos.sh"
      - ".github/workflows/macos-bundle.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build app bundle and DMG
        id: bundle
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/bundle-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: averroes-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ steps.bundle.outputs.app_bundle }}
            ${{ steps.bundle.outputs.dmg }}
