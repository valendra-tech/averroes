[package]
name = "averroes-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "averroes-gpui"
path = "src/main.rs"

[dependencies]
averroes-core = { path = "../core" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c" }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
futures = "0.3"
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
oxibrowser-core = { version = "0.20.0", default-features = false }
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.10"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
sys-locale = "0.3"
foreign-types = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSColor", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "objc2-core-foundation", "objc2-quartz-core"] }
block2 = "0.6"
raw-window-handle = "0.6"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
