[package]
name = "averroes-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "averroes-gpui"
path = "src/main.rs"

[dependencies]
averroes-core = { path = "../core" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "a8d1d2650493bbb01eb39412dea823173e1ea94c" }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
futures = "0.3"
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
semver = "1"
sha2 = "0.10"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
pulldown-cmark = "0.13.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
